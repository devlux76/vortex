syntax = "proto3";

// Conference messages of VORTEX v5.1 (Sections 6 to 8). Generated code is in
// src/core/proto; regenerate with `bun run proto` after changing this file.
//
// A conference packet travels on a direct stream after one byte of value 1,
// which tells it apart from a conversation packet (JSON) and a discovery
// packet (byte 0).

// How a host admits participants (Section 6.1).
enum Admission {
  OPEN = 0;
  INVITATION = 1;
  GROUP = 2;
}

// Section 6.1. Sent only inside a SignedDescriptor. Held by the host and
// returned in discovery results and join replies; never broadcast.
message Descriptor {
  // 16 bytes. For a conference formed from an open interest it is that
  // interest's announcement id (Section 6.2).
  bytes conference_id = 1;
  // SHA-256 of the embedding profile, 32 bytes.
  bytes namespace = 2;
  uint32 profile_version = 3;
  // Embedding of the topic statement, in the profile's encoding.
  bytes topic_vector = 4;
  // The hosting service's peer identity, in its string form. It signs.
  string host = 5;
  // An encoded Contact (discovery.proto) at which the host can be dialed.
  bytes contact = 6;
  // A count, never a list: membership is disclosed only after admission.
  uint32 participant_count = 7;
  uint32 capacity = 8;
  Admission admission = 9;
  // Milliseconds since the Unix epoch.
  uint64 created_at = 10;
  uint64 expires_at = 11;
  // Positive monotonically increasing host revision, covered by the signature.
  // Receivers reject missing revisions and stale updates for an existing room.
  uint64 revision = 12;
}

message SignedDescriptor {
  // An encoded Descriptor.
  bytes descriptor = 1;
  // By the descriptor's host, over a fixed domain prefix and `descriptor`.
  bytes signature = 2;
}

// Certifies one agent session's key for one conference (Section 8.1). The
// service's peer identity signs it, so participants can check which service
// vouches for a session and learn nothing else about the agent behind it.
message SessionCert {
  bytes conference_id = 1;
  // The session's Ed25519 public key, 32 bytes. Created when it joins.
  bytes session_key = 2;
  // The certifying service's peer identity, in its string form.
  string service = 3;
  // Milliseconds since the Unix epoch.
  uint64 issued_at = 4;
  // By `service`, over a fixed domain prefix and the fields above.
  bytes signature = 5;
}

// Section 8.1. Sent only inside a SignedMessage.
message ConferenceMessage {
  // 16 random bytes. Duplicates are discarded by this id (Section 7.3).
  bytes message_id = 1;
  bytes conference_id = 2;
  // The sending session's public key, 32 bytes.
  bytes sender = 3;
  // Milliseconds since the Unix epoch.
  uint64 timestamp = 4;
  // Message category, for example "text". Application data.
  string type = 5;
  bytes content = 6;
  // The message_id this one answers, when it answers one.
  optional bytes reply_to = 7;
}

message SignedMessage {
  // An encoded ConferenceMessage.
  bytes message = 1;
  // By the message's sender (a session key), over a fixed domain prefix and `message`.
  bytes signature = 2;
}

// --- Conference packets (Sections 6.2 to 6.4, 7.3) -------------------------
// One ConferencePacket per direct stream, after one byte of value 1.

// A service asks to join on behalf of one of its agent sessions.
message JoinRequest {
  // 16 bytes: the conference id, or the announcement id of the open interest
  // the conference is to form from (Section 6.2). They are the same value
  // once the conference exists.
  bytes conference_ref = 1;
  // An encoded SessionCert for the joining session, issued for conference_ref.
  bytes cert = 2;
  // The joiner's own announcement id that this match answered, when there is
  // one. Used only for the crossing rule of Section 6.2.
  optional bytes own_announcement_id = 3;
}

// The host's answer to a JoinRequest.
message JoinReply {
  bytes conference_ref = 1;
  bool accepted = 2;
  // When refused: 'unknown', 'full', 'closed', 'crossing', 'not_admitted' or 'invalid'.
  string reason = 3;
  // When accepted: an encoded SignedDescriptor with the count after this join.
  bytes descriptor = 4;
  // When accepted: an encoded SessionCert for every participant, the host's
  // own session first. Membership is disclosed only here, after admission.
  repeated bytes roster = 5;
}

// Host to every other participant: a session has joined.
message Arrival {
  bytes conference_id = 1;
  bytes cert = 2;
  // The descriptor with the new count.
  bytes descriptor = 3;
}

// Participant to host: this session is leaving.
message Leave {
  bytes conference_id = 1;
  bytes session_key = 2;
}

// Host to every remaining participant: a session has left.
message Departure {
  bytes conference_id = 1;
  bytes session_key = 2;
  bytes descriptor = 3;
}

// Participant to host, and host to every other participant, unchanged: one
// encoded SignedMessage.
message Post {
  bytes conference_id = 1;
  bytes message = 2;
}

// Host to every participant: the conference is over.
message Close {
  bytes conference_id = 1;
}

// Host to every participant: the conference topic has a new revision. The
// descriptor keeps the same id, host, membership count, capacity, admission,
// creation and expiry; only the topic vector and revision change. Source text
// never travels: receivers keep no statement for it.
message TopicUpdate {
  bytes conference_id = 1;
  // An encoded SignedDescriptor at a newer revision.
  bytes descriptor = 2;
}

// Membership-gated, paginated history. Session key must currently belong to
// the authenticated transport sender; discovery alone cannot request history.
message HistoryRequest {
  bytes conference_id = 1;
  bytes request_id = 2; // 16 unpredictable bytes, chosen by the reader.
  bytes session_key = 3;
  uint64 after = 4; // Host sequence, not an owner inbox cursor.
  uint32 limit = 5;
}

// Original signatures survive departure; only authors in this page are named.
message HistoryEntry {
  uint64 sequence = 1;
  bytes message = 2; // SignedMessage
  bytes cert = 3; // SessionCert for this message's sender and conference.
}

message HistoryReply {
  bytes conference_id = 1;
  bytes request_id = 2;
  string error = 3; // unknown, not_member, invalid; refused pages carry no entries.
  repeated HistoryEntry entries = 4;
  uint64 cursor = 5;
  uint64 first_available = 6;
  uint64 latest = 7;
  bool more = 8;
}

message ConferencePacket {
  oneof body {
    JoinRequest join = 1;
    JoinReply reply = 2;
    Arrival arrival = 3;
    Leave leave = 4;
    Departure departure = 5;
    Post post = 6;
    Close close = 7;
    HistoryRequest history_request = 8;
    HistoryReply history_reply = 9;
    TopicUpdate topic_update = 10;
  }
}
